name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sgia_testing
          POSTGRES_USER: sgia
          POSTGRES_PASSWORD: sgia_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgia -d sgia_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, dom, openssl, mbstring, gd
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
      # Umbral conservador, no medido localmente (sin driver de cobertura): subirlo tras el primer run.
      - run: php artisan test --coverage --min=60
